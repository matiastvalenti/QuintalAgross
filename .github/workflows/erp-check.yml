name: Quintal ERP - Ventas y Compras

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar formularios y pantallas
        run: npm run build
      - name: Pruebas de remitos y facturas parciales
        run: npm test -- --run src/utils/documentQuantities.test.js src/modules/common/OrderEmailDialog.test.jsx src/modules/common/useInternalCommercialDocuments.test.jsx src/modules/common/InvoiceWorkspaceTabs.test.jsx src/components/workspace/windowGeometry.test.js src/components/workspace/Dock.test.jsx src/components/layout/DocumentListPage.test.jsx src/components/ui/Autocomplete.test.jsx src/components/workspace/WindowFrame.test.jsx src/modules/common/BnaDivisasRateField.test.jsx src/utils/remitoPackages.test.js src/utils/fxValidation.test.js src/tests/modules/ChequeEntryDialog.test.jsx src/tests/modules/ReceiptCollectionForm.test.jsx src/modules/entities/components/EntityImporter.test.jsx src/modules/entities/components/EntitiesTable.test.jsx src/components/layout/Sidebar.test.jsx src/utils/openStandaloneWindow.test.js src/modules/entities/EntitiesManagerStandalonePage.test.jsx src/modules/config/SystemConfigPage.test.jsx src/components/ui/Card.test.jsx

  pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias de pruebas
        run: python -m pip install pytest fastapi
      - name: Verificar sintaxis de backend comercial
        run: python -m compileall -q backend/app/modules/purchases backend/app/modules/sales backend/app/modules/entities backend/app/api/router.py backend/app/modules/accounting/document_router.py backend/app/modules/accounting/document_schemas.py backend/app/db/models/models.py backend/app/db/models/finance_models.py backend/app/db/session.py backend/app/modules/finance/cheque_schemas.py backend/app/modules/config_router.py backend/app/modules/entities/router.py backend/app/api/ai_router.py backend/app/modules/fx/router.py backend/app/modules/fx/bna_rates.py backend/app/modules/finance/cheque_reversal.py backend/app/core/config.py backend/app/main.py backend/app/modules/auth/auth_router.py backend/app/modules/auth/security_policy.py
      - name: Pruebas de unidades y envases
        run: PYTHONPATH=backend python -m pytest --confcutdir=backend/tests/unit backend/tests/unit/test_fractional_packages.py backend/tests/unit/test_cheque_reversal.py backend/tests/unit/test_entity_import_utils.py backend/tests/unit/test_entities_import_route.py checks/test_bna_rates.py backend/tests/unit/test_auth_security_policy.py -q
